[project]
name = "loadpilot-model"
version = "0.1.0"
description = "PyTorch machine learning workspace for the LoadPilot"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.7,<3",
    "numpy>=2,<3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.6,<2",
    "matplotlib>=3.10,<4",
]

[project.optional-dependencies]
notebooks = ["jupyterlab>=4,<5", "ipykernel>=6,<8"]
api = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "ruff>=0.11,<1",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["loadpilot_model*"]
